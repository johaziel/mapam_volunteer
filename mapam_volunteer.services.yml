services:
  mapam_volunteer.registration_validator:
    class: Drupal\mapam_volunteer\RegistrationValidator
    arguments: ['@entity_type.manager', '@plugin.manager.parent_event_target', '@datetime.time']
  mapam_volunteer.pole_referents:
    class: Drupal\mapam_volunteer\PoleReferents
  mapam_volunteer.flag_fse_new_user_subscriber:
    class: Drupal\mapam_volunteer\EventSubscriber\FlagFseNewUserSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  mapam_volunteer.local_task_access:
    class: '\Drupal\mapam_volunteer\Plugin\views\access\LocalTaskAccess'
    parent: default_plugin_manager
  mapam_volunteer.local_task_event_access:
    class: '\Drupal\mapam_volunteer\Plugin\views\access\LocalTaskEventAccess'
    parent: default_plugin_manager
  mapam_volunteer.local_task_pole_access:
    class: '\Drupal\mapam_volunteer\Plugin\views\access\LocalTaskPoleAccess'
    parent: default_plugin_manager
  mapam_volunteer.print_css_alter_subscriber:
    class: Drupal\mapam_volunteer\EventSubscriber\EntityPrintSubscriber
    tags:
    - { name: event_subscriber }
  mapam_volunteer.node_dashboard_redirect_subscriber:
    class: Drupal\mapam_volunteer\EventSubscriber\NodeDashboardRedirectSubscriber
    arguments: ['@current_user','@current_route_match','@request_stack']
    tags:
      - { name: event_subscriber }
  mapam_volunteer.user_dashboard_redirect_subscriber:
    class: Drupal\mapam_volunteer\EventSubscriber\UserDashboardRedirectSubscriber
    arguments: ['@current_user','@current_route_match','@request_stack']
    tags:
      - { name: event_subscriber }
  plugin.manager.parent_event_target:
    class: Drupal\mapam_volunteer\Plugin\ParentEventTargetManager
    parent: default_plugin_manager
